[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgechaindb"
version = "0.8.3"
description = "An edge-first, quorum-signed blockchain database for IoT telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Vahid Tavakkoli"}]
keywords = [
  "iot",
  "edge-computing",
  "tamper-evident",
  "merkle-tree",
  "quorum",
  "sqlite",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cbor2>=5.6",
  "cryptography>=44",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "PyYAML>=6.0",
  "docker>=7.1"
]

[project.urls]
Homepage = "https://github.com/vtavakkoli/EdgeChainDB"
Repository = "https://github.com/vtavakkoli/EdgeChainDB"
Issues = "https://github.com/vtavakkoli/EdgeChainDB/issues"
Changelog = "https://github.com/vtavakkoli/EdgeChainDB/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.scripts]
edgechain-demo = "edgechaindb.simulator:main"
edgechain-verify = "edgechaindb.cli:verify_main"
edgechain-api = "edgechaindb.cli:api_main"
edgechain-gateway = "edgechaindb.gateway_server:main"
edgechain-device = "edgechaindb.device_node:main"
edgechain-system-test = "edgechaindb.system_test:main"
edgechain-recovery-check = "edgechaindb.recovery_report:main"
edgechain-benchmark = "edgechaindb.benchmark:main"
edgechain-cluster-runtime = "edgechaindb.cluster_runtime:main"
edgechain-experiment-worker = "edgechaindb.experiments.worker:main"
edgechain-experiment-matrix = "edgechaindb.experiments.runner:main"
edgechain-experiment-merge = "edgechaindb.experiments.merge:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
strict_config = true
strict_markers = true

[tool.setuptools.packages.find]
include = ["edgechaindb*"]
exclude = ["tests*", "result*", "scripts*"]
